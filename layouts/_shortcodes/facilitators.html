{{ $s := .Get "head"}}
{{ $wantHead := eq $s "true" }}

{{ range $category, $staff := .Site.Data.staff }}
  {{ range $staff }}
    {{ $isHead := .head_facilitator }}
    {{ if eq $isHead $wantHead }}
      <div class="book-columns flex flex-wrap">

        <!-- Trying to recreate the format generated by % Column % in markup lol -->
        <!-- Feel free to change this if you find a better implementation-->
        <div class="flex-even markdown-inner" style="flex-grow: 1;">
          <p>
            <img src="{{ .image }}" alt="{{ .name }}">
          </p>
        </div>

        <div class="flex-even markdown-inner" style="flex-grow: 1;">
          <h3 id="{{ urlize .name }}">
            {{ .name }}
            <a class="anchor" href="#{{ urlize .name }}">#</a>
          </h3>
          <p><code>{{ .username }}</code></p>
          <hr>
          <p><a href="mailto:{{ .email }}">{{ .email }}</a></p>
          <p>{{ .bio | markdownify }}</p>
        </div>

        <div class="flex-even markdown-inner" style="flex-grow: 1;"></div>

        <div class="flex-even markdown-inner" style="flex-grow: 1;"></div>
      </div>
    {{ end }}
  {{ end }}
{{ end }}
